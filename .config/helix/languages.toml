# ============================================================
# LANGUAGE SERVERS
# ============================================================

# ----------------------------
# Go (gopls)
# ----------------------------
[language-server.gopls]
command = "gopls"

[language-server.gopls.config]
gofumpt = true
local = "goimports"
semanticTokens = true
staticcheck = true
verboseOutput = true
usePlaceholders = true
completeUnimported = true

[language-server.gopls.config.analyses]
fieldalignment = false
nilness = true
unusedparams = true
unusedwrite = true
useany = true

[language-server.gopls.config.hints]
assignVariableType = true
compositeLiteralFields = true
compositeLiteralTypes = true
constantValues = true
functionTypeParameters = true
parameterNames = true
rangeVariableTypes = true

# ----------------------------
# Tailwind
# ----------------------------
[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.tailwindcss-ls.config.userLanguages]
templ = "html"
"*.templ" = "html"

[language-server.tailwindcss-ls.config.tailwindCSS.experimental]
classRegex = [
  "class\\s*=\\s*\"([^\"]*)\"",
  "class\\(([^)]*)\\)"
]

# ----------------------------
# TypeScript / JavaScript
# ----------------------------
[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]

[language-server.typescript-language-server.config]
documentFormatting = false
hostInfo = "helix"

# ----------------------------
# Biome
# ----------------------------
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

# ----------------------------
# json
# ----------------------------
[language-server.json-ls]
command = "vscode-json-language-server"
args = ["--stdio"]

[[language-server.json-ls.config.json.schemas]]
fileMatch = ["*.json", "*.jsonc"]
url = "https://json.schemastore.org"

[language-server.json-ls.config.json]
enable = true

# ----------------------------
# ESLint
# ----------------------------
[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.eslint.config]
run = "onSave"
validate = "on"
useFlatConfig = false
experimental = { useFlatConfig = false }
format = { enable = true }
codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }

# ----------------------------
# CSS / HTML
# ----------------------------
[language-server.vscode-css-language-server.config]
css  = { validate = { enable = true } }
scss = { validate = { enable = true } }
less = { validate = { enable = true } }
provideFormatter = true

# ----------------------------
# Emmet
# ----------------------------
[language-server.emmet-ls]
command = "emmet-language-server"
args = ["--stdio"]

# ----------------------------
# SQL
# ----------------------------
[language-server.sqls]
command = "sqls"

# ----------------------------
# Simple Completion LSP
# ----------------------------
[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
max_completion_items = 20
snippets_first = true
snippets_inline_by_word_tail = false
feature_words = true
feature_snippets = true
feature_unicode_input = true
feature_paths = true
feature_citations = false

[language-server.scls.environment]
RUST_LOG = "info,simple-completion-language-server=info"
LOG_FILE = "/tmp/completion.log"

# ----------------------------
# Templ
# ----------------------------
[language-server.templ]
command = "templ"
args = ["lsp"]


# ============================================================
# LANGUAGE DEFINITIONS
# ============================================================

# ----------------------------
# Go
# ----------------------------
[[language]]
name = "go"
roots = ["go.work", "go.mod"]
auto-format = true
comment-token = "//"
formatter = { command = "goimports" }
language-servers = ["scls", "gopls"]

# ----------------------------
# HTML
# ----------------------------
[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "html"] }
language-servers = [
  "tailwindcss-ls",
  "vscode-html-language-server",
  "emmet-language-server",
  "scls"
]

# ----------------------------
# CSS
# ----------------------------
[[language]]
name = "css"
language-id = "css"
scope = "source.css"
file-types = ["css"]
auto-format = true
formatter = { command = "prettier", args = ["--parser", "css"] }
language-servers = [
  "vscode-css-language-server",
  "tailwindcss-ls",
  "scls"
]

# ----------------------------
# Templ
# ----------------------------
[[language]]
name = "templ"
scope = "source.templ"
auto-format = true
formatter = { command = "templ", args = ["fmt"] }
language-servers = [
  "tailwindcss-ls",
  "templ",
  "emmet-language-server"
]
indent = { tab-width = 4, unit = "    " }

# ----------------------------
# SQL
# ----------------------------
[[language]]
name = "sql"
language-servers = ["sqls"]

# ----------------------------
# JavaScript
# ----------------------------
[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "eslint"
]

# ----------------------------
# TypeScript
# ----------------------------
[[language]]
name = "typescript"
auto-format = true
# language-servers = [
#   "biome",
#   { name = "typescript-language-server", except-features = ["format"] }
# ]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "eslint"
]

[[language]]
name = "tsx"
auto-format = true
# language-servers = [
#   "biome",
#   { name = "typescript-language-server", except-features = ["format"] }
# ]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "eslint"
]


[[language]]
name = "jsx"
auto-format = true
# language-servers = [
#   "biome",
#   { name = "typescript-language-server", except-features = ["format"] }
# ]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [
  { name = "vtsls", except-features = ["format"] },
  "eslint"
]


[[language]]
name = "json"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "json"] }
language-servers = [
  # "biome",
  "json-ls"
]

# ----------------------------
# Prisma
# ----------------------------
[[language]]
name = "prisma"
auto-format = true
