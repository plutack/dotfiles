[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = [ "--parser", "html"] }
language-servers = [ "tailwind-ls", "vscode-html-language-server", "emmet-language-server", "scls"]
 

[[language]]
name = "css"
language-id = "css"
scope = "source.css"
file-types = ["css"]
language-servers = [ "vscode-css-language-server","tailwindcss-ls", "scls"]
formatter = { command = 'prettier', args = ["--parser", "css"] }
auto-format = true

[[language]]
name = "go"
roots = ["go.work", "go.mod"]
auto-format = true
comment-token = "//"
formatter = { command = "goimports"}
language-servers = [ "scls", "gopls"]

[[language]]
name = "templ"
scope = "source.templ"
auto-format = true
formatter = { command = "templ", args = [ "fmt" ]}
language-servers = [ "tailwindcss-ls", "templ", "emmet-language-server" ]
indent = { tab-width = 4, unit = "    " }


[language-server.vscode-eslint-language-server]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.vscode-eslint-language-server.config]
validate = "on"
experimental = { useFlatConfig = false }
rulesCustomizations = []
run = "onType"
problems = { shortenToSingleLine = false }
nodePath = ""

[language-server.vscode-eslint-language-server.config.codeAction.disableRuleComment]
enable = true
location = "separateLine"

[language-server.vscode-eslint-language-server.config.codeAction.showDocumentation]
enable = true

[language-server.vscode-eslint-language-server.config.workingDirectory]
mode = "location"

[[language]]
name = "typescript"
language-servers = [ "typescript-language-server", "biome", "emmet-ls" ]
formatter = { command = "biome", args = [ "format", "--stdin-file-path", "a.ts" ] }
# formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
# formatter = { command = "dprint", args = [ "fmt", "--stdin", "typescript" ] }
auto-format = true

