# go lsp config
[language-server.gopls]
command = "gopls"
config = { "gofumpt" = true, "local" = "goimports", "semanticTokens" = true, "staticcheck" = true, "verboseOutput" = true, "analyses" = { "fieldalignment" = false, "nilness" = true, unusedparams = true, unusedwrite = true, useany = true }, usePlaceholders = true, completeUnimported = true, hints = { "assignVariableType" = true, "compositeLiteralFields" = true, "compositeLiteralTypes" = true, "constantValues" = true, "functionTypeParameters" = true, "parameterNames" = true, "rangeVariableTypes" = true } }

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = [ "--stdio" ]

[language-server.biome]
command = "biome"
args = [ "lsp-proxy" ]

[language-server.tailwindcss-ls.config.userLanguages]
"*.templ" = "html"
templ = "html"

[language-server.tailwindcss-ls.config.tailwindCSS.experimental]
classRegex = [
        # Match class attributes in HTML-like syntax
        "class\\s*=\\s*\"([^\"]*)\"",

        # Match Templ's function-like class syntax: class(...)
        "class\\(([^)]*)\\)"
      ] 

